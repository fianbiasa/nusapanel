# Port 80 for every host name that no website or the panel uses (and for the
# bare IP address). setup.sh installs this file. Without it, Nginx would
# answer such requests with whichever site it loaded first, which could be a
# customer's website.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    return 404;
}
