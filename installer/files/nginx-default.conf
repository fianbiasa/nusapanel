# Ports 80 and 443 for every host name that no website or the panel uses
# (and for the bare IP address). setup.sh installs this file. Without it,
# Nginx would answer such requests with whichever site it loaded first,
# which could be a customer's website.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Let's Encrypt checks for names that have no website here, such as
    # mail.<domain> of the accounts' domains (its certificate is for mail
    # apps), answered from the shared ACME folder.
    location ^~ /.well-known/acme-challenge/ {
        root {{ACME_DIR}};
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

# On HTTPS the handshake itself is refused, so a name without its own
# certificate never gets to see a customer's certificate. Needs no
# certificate of its own, so nginx -t passes before any website has HTTPS.
# http2 like every other server on port 443, or Nginx warns that the
# options of the port differ.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    return 444;
}
