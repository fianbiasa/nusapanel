# rayxo: Apache behind Nginx for customer websites. setup.sh fills in
# the double-brace placeholders and enables this as conf "rayxo".
# Apache only listens on 127.0.0.1:8080 (ports.conf); Nginx in front owns
# ports 80 and 443, serves static files and passes the rest here.

ServerName {{HOSTNAME}}

# These replace Ubuntu's security.conf, which setup.sh disables because it
# loads after this file and would turn them back on.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The visitor's real address, as Nginx passes it.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1 ::1

# Sites behind an HTTPS Nginx know they are on HTTPS (WordPress needs this).
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Customer homes. Symlinks are only followed when the link and its target
# have the same owner, so nobody can link to another account's files.
<Directory /home>
    Options SymLinksIfOwnerMatch
    AllowOverride AuthConfig FileInfo Indexes Limit Options=Indexes,MultiViews,SymLinksIfOwnerMatch
    CGIPassAuth On
    Require all granted
</Directory>

# One vhost per domain, written by the agent (rayxod).
IncludeOptional /etc/apache2/rayxo/*/*.conf
