; Roundcube (webmail) for rayxo. setup.sh fills in the double-brace
; placeholders. Runs as rayxo-webmail, which can read neither the panel's
; configuration nor customer files: Roundcube only reaches Dovecot and
; Postfix on this server (as the mailbox that signed in) and its own
; database.
[rayxo-webmail]
user = rayxo-webmail
group = rayxo-webmail

listen = /run/php/rayxo-webmail.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 20
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,putenv,mail
php_admin_value[open_basedir] = {{INSTALL_DIR}}/:/etc/rayxo-webmail/:/var/lib/rayxo-webmail/
php_admin_value[sys_temp_dir] = /var/lib/rayxo-webmail/tmp
php_admin_value[upload_tmp_dir] = /var/lib/rayxo-webmail/tmp

; Roundcube keeps its sessions in its database and cleans them up when
; PHP's session garbage collection runs.
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on

; Attachments up to 25 MB; with their encoding a message stays below
; Postfix's 50 MB limit.
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 120

php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/rayxo-webmail/log/php-error.log
catch_workers_output = yes
