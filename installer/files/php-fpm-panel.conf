; nusapanel control panel. setup.sh fills in the double-brace placeholders.
; Customer sites never use this pool: each hosting account gets its own.
[nusapanel]
user = nusapanel
group = nusapanel

listen = /run/php/nusapanel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

; The panel never runs programs itself: every system change goes through the
; agent (nusad). Disabling these (including putenv + mail, the LD_PRELOAD
; trick) is defense in depth only. The real boundary is that the panel runs
; as an unprivileged user and the agent only accepts its fixed list of actions.
php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,putenv,mail
php_admin_value[open_basedir] = {{INSTALL_DIR}}/:{{DATA_DIR}}/:{{CONFIG_DIR}}/panel.env:/tmp/:/run/nusapanel/

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = {{DATA_DIR}}/storage/logs/php-fpm.log
catch_workers_output = yes
