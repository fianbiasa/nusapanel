# Server hostname on port 80. setup.sh fills in the double-brace placeholders.
# Serves Let's Encrypt challenges for the panel certificate; phpMyAdmin goes
# to HTTPS and everything else to the panel.
server {
    listen 80;
    listen [::]:80;
    server_name {{HOSTNAME}};

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root {{ACME_DIR}};
        default_type text/plain;
    }

    location ^~ /phpmyadmin {
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host:{{PANEL_PORT}}$request_uri;
    }
}
