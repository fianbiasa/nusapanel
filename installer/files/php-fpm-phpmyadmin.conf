; phpMyAdmin for nusapanel. setup.sh fills in the double-brace placeholders.
; Runs as nusa-pma, which can read neither the panel's configuration nor
; customer files: phpMyAdmin only reaches MariaDB, as the account's owner
; user the panel signed it in with.
[nusapanel-phpmyadmin]
user = nusa-pma
group = nusa-pma

listen = /run/php/nusapanel-phpmyadmin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[disable_functions] = exec,shell_exec,system,passthru,proc_open,popen,pcntl_exec,putenv,mail
php_admin_value[open_basedir] = {{INSTALL_DIR}}/:/etc/nusa-pma/:/var/lib/nusa-pma/
php_admin_value[sys_temp_dir] = /var/lib/nusa-pma/tmp
php_admin_value[upload_tmp_dir] = /var/lib/nusa-pma/tmp
; LOAD DATA LOCAL would let SQL read files phpMyAdmin can read.
php_admin_flag[mysqli.allow_local_infile] = off

; Sessions hold the MariaDB password of the session, so they live in a
; directory only nusa-pma can read and are cleaned up here (Ubuntu's own
; cleanup only covers /var/lib/php/sessions). They last as long as the
; panel keeps the password valid.
php_admin_value[session.save_path] = /var/lib/nusa-pma/sessions
php_admin_value[session.gc_probability] = 1
php_admin_value[session.gc_divisor] = 100
php_admin_value[session.gc_maxlifetime] = 3600
php_admin_flag[session.cookie_secure] = on
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.use_strict_mode] = on

; Imports and exports of large databases.
php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 256M
php_admin_value[post_max_size] = 256M
php_admin_value[max_execution_time] = 600
php_admin_value[max_input_time] = 600
php_admin_value[max_input_vars] = 10000

; phpMyAdmin 5.2 predates PHP 8.4 and triggers deprecation notices on it.
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/lib/nusa-pma/log/php-error.log
catch_workers_output = yes
