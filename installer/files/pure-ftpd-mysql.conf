# Pure-FTPd's access to the nusapanel database. setup.sh writes this file to
# /etc/pure-ftpd/db/mysql.conf (0600 root) on every run and appends the
# MYSQLPassword line, so changes made there are lost.
#
# nusapanel-ftp may only read the v_ftp_users view: the logins that are ready,
# of active hosting accounts only, with their SHA512-CRYPT password, the
# account's Linux uid and gid, and the folder each login is shut in.
MYSQLSocket      /run/mysqld/mysqld.sock
MYSQLUser        nusapanel-ftp
MYSQLDatabase    nusapanel
MYSQLCrypt       crypt
MYSQLGetPW       SELECT password FROM v_ftp_users WHERE login = '\L'
MYSQLGetUID      SELECT uid FROM v_ftp_users WHERE login = '\L'
MYSQLGetGID      SELECT gid FROM v_ftp_users WHERE login = '\L'
MYSQLGetDir      SELECT dir FROM v_ftp_users WHERE login = '\L'
