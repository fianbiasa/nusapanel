# phpMyAdmin and webmail (Roundcube) on the server hostname, port 443.
# setup.sh fills in the double-brace placeholders.
#
# They are served on another port than the panel, so their pages are not the
# panel's origin, each by its own PHP-FPM pool (users rayxo-pma and
# rayxo-webmail). Only their entry points run; their libraries, templates,
# configuration and vendor code are never served. Everything else on this
# name goes to the panel.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{HOSTNAME}};

    ssl_certificate {{CONFIG_DIR}}/ssl/panel.crt;
    ssl_certificate_key {{CONFIG_DIR}}/ssl/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 256m;

    # The release holds phpMyAdmin in phpmyadmin/.
    root {{INSTALL_DIR}}/current;

    access_log {{LOG_DIR}}/phpmyadmin-access.log;
    error_log {{LOG_DIR}}/phpmyadmin-error.log;

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        index index.php;

        location ~ ^/phpmyadmin/(?:index|url|rayxo-sso|js/messages)\.php$ {
            fastcgi_pass unix:/run/php/rayxo-phpmyadmin.sock;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 600s;
            include fastcgi_params;
            # $realpath_root resolves the "current" symlink, so a new release
            # is picked up immediately and OPcache never mixes two releases.
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ ^/phpmyadmin/(?:js|themes|doc)/ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        location = /phpmyadmin/favicon.ico {
            access_log off;
            try_files $uri =404;
        }

        # Anything else in the phpMyAdmin folder (configuration, libraries,
        # templates, locale files).
        location ~ ^/phpmyadmin/.+ {
            return 404;
        }
    }

    location = /webmail {
        return 301 /webmail/;
    }

    # The release holds Roundcube in roundcube/ and links webmail/ to its
    # public_html/, which only has index.php and static.php: static.php
    # serves skins and plugin files from the folders Roundcube allows.
    location ^~ /webmail/ {
        index index.php;
        client_max_body_size 30m;
        access_log {{LOG_DIR}}/webmail-access.log;

        location ~ ^/webmail/(?:index|static)\.php(?:/|$) {
            fastcgi_split_path_info ^(/webmail/(?:index|static)\.php)(/.*)$;
            fastcgi_pass unix:/run/php/rayxo-webmail.sock;
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 120s;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ ^/webmail/.+ {
            return 404;
        }
    }

    location / {
        return 301 https://$host:{{PANEL_PORT}}$request_uri;
    }
}
