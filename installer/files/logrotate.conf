# nusapanel logs. setup.sh fills in the double-brace placeholders.
# Laravel's own logs rotate themselves (LOG_CHANNEL=daily).

{{LOG_DIR}}/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1 || true
    endscript
}

{{DATA_DIR}}/storage/logs/php-fpm.log {
    su nusapanel nusapanel
    weekly
    rotate 8
    missingok
    notifempty
    compress
    copytruncate
}
