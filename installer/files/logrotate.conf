# rayxo logs. setup.sh fills in the double-brace placeholders.
# Laravel's own logs rotate themselves (LOG_CHANNEL=daily).

{{LOG_DIR}}/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1 || true
    endscript
}

# Customer websites: <domain>.access.log and .error.log from Nginx,
# <domain>.apache-error.log from Apache.
{{LOG_DIR}}/domains/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        invoke-rc.d nginx rotate >/dev/null 2>&1 || true
        invoke-rc.d apache2 reload >/dev/null 2>&1 || true
    endscript
}

{{DATA_DIR}}/storage/logs/php-fpm.log {
    su rayxo rayxo
    weekly
    rotate 8
    missingok
    notifempty
    compress
    copytruncate
}

# PHP errors of phpMyAdmin's pool, written as rayxo-pma.
/var/lib/rayxo-pma/log/php-error.log {
    su rayxo-pma rayxo-pma
    weekly
    rotate 8
    missingok
    notifempty
    compress
    copytruncate
}
