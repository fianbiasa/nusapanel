# rayxo: every hosting account is in rayxo-sftp. Accounts whose package
# allows SSH are in rayxo-ssh too; the agent adds and removes them. Neither
# gets forwarding or tunnels. setup.sh writes this file to
# /etc/ssh/sshd_config.d/rayxo-sftp.conf on every run.
#
# SSH: a shell, in the account's jail, which the agent builds: the server's
# programs (read-only, no setuid), an /etc that only knows the account, and
# the account's own home. It logs in with the SFTP password set in the panel,
# or with keys in ~/.ssh/authorized_keys.
Match Group rayxo-ssh
    ChrootDirectory {{DATA_DIR}}/jail/%u
    PasswordAuthentication yes
    PubkeyAuthentication yes
    DisableForwarding yes
    PermitTunnel no
    PermitTTY yes
    PermitUserRC no

# SFTP only, in the account's own home, with uploads readable by the web
# server (umask 022). There is no chroot: homes are 0710, so an account
# cannot enter another's. A negated group wins in sshd, so this block skips
# the accounts with SSH.
Match Group rayxo-sftp,!rayxo-ssh
    ForceCommand internal-sftp -u 022
    PasswordAuthentication yes
    PubkeyAuthentication yes
    DisableForwarding yes
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
