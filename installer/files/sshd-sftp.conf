# nusapanel: members of nusa-sftp (every hosting account) only get SFTP, in
# their own home: no shell, no forwarding, no tunnels, and uploads readable by
# the web server (umask 022). They log in with the SFTP password set in the
# panel, or with keys in ~/.ssh/authorized_keys. There is no chroot: homes are
# 0710, so an account cannot enter another's. setup.sh writes this file to
# /etc/ssh/sshd_config.d/nusapanel-sftp.conf on every run.
Match Group nusa-sftp
    ForceCommand internal-sftp -u 022
    PasswordAuthentication yes
    PubkeyAuthentication yes
    DisableForwarding yes
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
