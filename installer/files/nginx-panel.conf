# nusapanel control panel. setup.sh fills in the double-brace placeholders.
server {
    listen {{PANEL_PORT}} ssl http2;
    listen [::]:{{PANEL_PORT}} ssl http2;
    server_name _;

    root {{INSTALL_DIR}}/current/panel/public;
    index index.php;

    ssl_certificate {{CONFIG_DIR}}/ssl/panel.crt;
    ssl_certificate_key {{CONFIG_DIR}}/ssl/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Plain HTTP sent to the HTTPS port: send the browser to HTTPS instead.
    error_page 497 =301 https://$host:{{PANEL_PORT}}$request_uri;

    client_max_body_size 256m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log {{LOG_DIR}}/panel-access.log;
    error_log {{LOG_DIR}}/panel-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/nusapanel.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so a new release is
        # picked up immediately and OPcache never mixes two releases.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
