# rayxo control panel. setup.sh fills in the double-brace placeholders.
server {
    listen {{PANEL_PORT}} ssl http2;
    listen [::]:{{PANEL_PORT}} ssl http2;
    server_name _;

    root {{INSTALL_DIR}}/current/panel/public;
    index index.php;

    ssl_certificate {{CONFIG_DIR}}/ssl/panel.crt;
    ssl_certificate_key {{CONFIG_DIR}}/ssl/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Plain HTTP sent to the HTTPS port: send the browser to HTTPS instead.
    error_page 497 =301 https://$host:{{PANEL_PORT}}$request_uri;

    client_max_body_size 256m;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Only what cannot break the panel: no framing by other sites, no <base>
    # pointing scripts elsewhere, no plugins. Forms may still post to the
    # phpMyAdmin and webmail sign-on on port 443. No HSTS: when Let's Encrypt
    # fails, setup.sh falls back to a self-signed certificate, which HSTS
    # would lock the admin out with.
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    access_log {{LOG_DIR}}/panel-access.log;
    error_log {{LOG_DIR}}/panel-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/rayxo.sock;
        # Laravel's Link header (font and script preloads) plus cookies outgrow
        # nginx's default 4 KB, which turns every page into a 502.
        fastcgi_buffer_size 32k;
        # The file manager waits for copies, uploads and downloads.
        fastcgi_read_timeout 600s;
        fastcgi_buffers 16 16k;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so a new release is
        # picked up immediately and OPcache never mixes two releases.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
